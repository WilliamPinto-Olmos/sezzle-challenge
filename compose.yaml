services:
  backend:
    build:
      context: .
      target: backend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 5

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "5173:5173"
